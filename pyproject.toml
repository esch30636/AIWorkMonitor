[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aiworkmonitor"
version = "0.2.2"
description = "Cross-platform desktop telemetry agent and relay for the AIWorkMonitor Android app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "psutil>=6.1,<8",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17",
  "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]
windows-build = ["pyinstaller>=6.11,<7"]

[project.scripts]
aiwm-relay = "aiworkmonitor.relay:main"
aiwm-agent = "aiworkmonitor.windows_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiworkmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
